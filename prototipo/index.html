<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Pontua | Eventos e ranking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23171717%27%2F%3E%3Cg%20transform%3D%27translate(8.5%206)%20scale(.73)%27%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%276%27%20stroke-linejoin%3D%27round%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M15%206h34a7%207%200%200%201%207%207v17a6%206%200%200%200%200%2012v17a7%207%200%200%201-7%207H15a7%207%200%200%201-7-7V42a6%206%200%200%200%200-12V13a7%207%200%200%201%207-7z%27%2F%3E%3Cpath%20d%3D%27M21%2037l8%208%2015-17%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#ffffff;--side:#fafafa;--hover:#f5f5f5;--line:#e8e8e8;--line2:#d4d4d4;
  --ink:#171717;--body:#2b2b2b;--muted:#707070;--primary:#171717;
  --ok:#1a7f4b;--bad:#c0362c;--maybe:#a8700f;--wait:#8c8c8c;--focus:#2563eb;
  --chat:#efeae2;--in:#ffffff;--out:#d9fdd3;--wa:#008069;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--body);font:14px/1.5 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:6px 12px;border-radius:6px;z-index:60}
.skip:focus{left:12px}

/* estrutura */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100dvh}
.shell.dock-open{grid-template-columns:208px minmax(0,1fr) 372px}
.rail{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);background:var(--side);padding:14px 10px;display:flex;flex-direction:column;gap:14px}
.brand{padding:4px 8px;font-weight:600;color:var(--ink);font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--muted);font-weight:500;font-size:13.5px;text-align:left}
.nav button:hover{background:#efefef;color:var(--ink)}
.nav button[aria-current="page"]{background:#ececec;color:var(--ink)}
.nav svg{width:16px;height:16px}
.rail-foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--muted);line-height:1.45}
.main{min-width:0}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--bg)}
main{padding:24px 32px 64px}
.wrap{max-width:1040px}

/* texto */
h1,h2,h3{color:var(--ink);margin:0}
h1{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;line-height:1.4}
.eyebrow{font-size:13px;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 0;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* componentes */
.card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);font-weight:500;font-size:13.5px;line-height:1;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:#333}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover:not(:disabled){color:var(--ink)}
.btn.danger{border-color:transparent;color:var(--bad)}
.btn.danger:hover:not(:disabled){background:#fdf1f0}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn[aria-pressed="true"]{background:#ececec}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;color:var(--body)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge .dot{display:none}
.b-ok::before{background:var(--ok)}
.b-bad::before{background:var(--bad)}
.b-maybe::before{background:var(--maybe)}
.b-wait::before{background:var(--line2)}
.b-info::before{background:var(--ink)}
.b-wait{color:var(--muted)}
.niv{font-size:13px;color:var(--muted)}
.av{display:none}
.cellp b,.list b{font-weight:500;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--bg);color:var(--body);border-radius:6px;padding:3px 10px;font-size:13px}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--muted);padding:24px 0;margin:0}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--side)}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--hover)}
.pos-cell{width:84px;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mv{font-size:12px;margin-left:6px;white-space:nowrap}
.mv.up{color:var(--ok)}
.mv.down{color:var(--bad)}
.p{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.p.pos{color:var(--ok)}
.p.neg{color:var(--bad)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.kpi{padding:14px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:600;color:var(--ink);line-height:1.3;font-variant-numeric:tabular-nums}
.next h2{font-size:17px;margin:2px 0}
.todo{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.todo li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0;padding-bottom:0}
.todo b{font-weight:600;color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.list li>div{flex:1;min-width:0}
.list small{display:block;color:var(--muted);font-size:12.5px}
.list .rk{color:var(--muted);width:18px;font-variant-numeric:tabular-nums}

/* respostas */
.fbar{display:flex;gap:2px;height:6px;margin:14px 0 10px}
.fbar i{display:block;height:100%;border-radius:1px;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:2px}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* eventos */
.ev-list{border:1px solid var(--line);border-radius:8px}
.ev{display:grid;grid-template-columns:96px 1fr 200px 150px;gap:16px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--body)}
.ev:last-child{border-bottom:0}
.ev:hover{background:var(--hover)}
.ev .d{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.ev .d b{font-weight:500}
.ev .name{font-weight:500;color:var(--ink)}
.ev .meta{font-size:13px;color:var(--muted)}
.ev .fbar{margin:0 0 4px;height:4px}
.steps{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px}
.steps li{padding:10px 14px;border-left:1px solid var(--line);color:var(--muted)}
.steps li:first-child{border-left:0}
.steps li .n{display:none}
.steps li b{display:block;font-weight:500;font-size:13.5px}
.steps li small{font-size:13px}
.steps li.done b::after{content:" (feito)";font-weight:400;color:var(--muted)}
.steps li.done b,.steps li.now b{color:var(--ink)}
.steps li.now{box-shadow:inset 0 2px 0 var(--ink)}
.ev-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:stretch}
.ci{display:flex;gap:16px;align-items:center}
.qr{flex:none;background:#fff;padding:6px;border:1px solid var(--line);border-radius:6px;line-height:0}
.qr img,.qr canvas{display:block}
.code{font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:600;color:var(--ink)}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;border:1px dashed var(--line2);border-radius:8px;background:var(--side)}

/* formulario */
.form-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:start}
.form-grid>.stack:last-child{position:sticky;top:64px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:500;color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],textarea,select{border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 10px;width:100%;min-height:32px}
input::placeholder,textarea::placeholder{color:#a0a0a0}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:-1px}
textarea{resize:vertical;min-height:70px}
.recips{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.recip{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
.recip:last-child{border-bottom:0}
.recip:hover{background:var(--hover)}
.recip.off{opacity:.55;cursor:not-allowed}
.recip input{width:15px;height:15px;accent-color:var(--ink)}
.recip .rn{flex:1;min-width:0}
select.inl{width:auto;min-height:28px;padding:2px 8px;font-size:13px}
label.row{flex-wrap:nowrap;align-items:flex-start}
label.row input[type=checkbox]{flex:none;width:15px;height:15px;margin:3px 0 0}
.err{color:var(--bad);margin:0 0 8px}
.err:empty{display:none}

/* simulador: imita o WhatsApp de verdade */
.dock{position:sticky;top:0;height:100dvh;border-left:1px solid var(--line);background:var(--side);padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;z-index:8}
.phone{flex:1;min-height:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--chat)}
.phone-head{background:var(--wa);color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.phone-head b{font-weight:600;color:#fff}
.phone-head .muted{color:rgba(255,255,255,.8)}
.phone-head .badge{color:#fff}
.phone-head .badge::before{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:6px 9px;border-radius:8px;white-space:pre-wrap;font-size:13.5px;line-height:1.4;color:#111b21;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.msg .mi{display:block;width:100%;border-radius:6px;margin-bottom:6px}
.artes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arte{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px}
.arte .th{flex:none;width:64px;height:64px;border-radius:4px;border:1px dashed var(--line2);background:var(--side);object-fit:cover}
.arte img.th{border-style:solid}
.arte b{display:block;font-weight:500;color:var(--ink);font-size:13.5px}
.arte .small{display:block;margin-bottom:6px;line-height:1.35}
.msg.bot{background:var(--in);align-self:flex-start;border-top-left-radius:0}
.msg.user{background:var(--out);align-self:flex-end;border-top-right-radius:0}
.msg .btns{display:flex;flex-direction:column;margin:6px -9px -6px;border-top:1px solid #e9edef}
.msg .btns button{background:none;border:0;border-bottom:1px solid #e9edef;padding:8px;color:#027eb5;font-weight:500}
.msg .btns button:hover:not(:disabled){background:#f5f6f6}
.msg .btns button:last-child{border-bottom:0}
.msg .btns button:disabled{color:#8696a0;cursor:default}
.composer{background:#f0f2f5;padding:8px 10px 10px}
.composer form{display:flex;gap:6px}
.composer input{flex:1;border-radius:18px;border-color:transparent}
.composer .btn{border-radius:18px;background:var(--wa);border-color:var(--wa);color:#fff;height:32px}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.quick .chip{font-size:12px;padding:2px 8px;border-radius:12px}

/* gaveta e telao */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:21;padding:16px 20px 24px;overflow-y:auto;border-left:1px solid var(--line2);box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.drawer h1{margin:4px 0 2px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0;border:1px solid var(--line);border-radius:8px}
.mini div{padding:10px 12px;border-left:1px solid var(--line)}
.mini div:first-child{border-left:0}
.mini b{display:block;font-size:18px;font-weight:600;color:var(--ink);line-height:1.3}
.mini span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.telao{position:fixed;inset:0;z-index:40;background:#fff;display:grid;grid-template-columns:auto 1fr;gap:6vw;align-items:center;padding:48px 7vw;overflow-y:auto}
.telao .x{position:absolute;top:14px;right:18px}
.telao h1{font-size:clamp(28px,3.4vw,48px);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em}
.telao .qr{padding:14px;border-radius:12px}
.telao .code{font-size:clamp(20px,2.2vw,30px)}
.telao .cnt{display:flex;align-items:baseline;gap:12px;margin:28px 0 16px}
.telao .cnt b{font-size:clamp(64px,8vw,120px);font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.telao .cnt span{font-size:18px;color:var(--muted)}
.telao .list{max-width:440px}
.telao .list li{font-size:16px;color:var(--ink)}

.rules{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.rules table{min-width:0;margin-top:6px}
.rules td{padding-left:0;padding-right:0}
.rules p{margin:0;max-width:68ch}
.rules p+p{margin-top:8px}
.note{margin:10px 0 0;color:var(--muted);font-size:13px}
.cmd{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--ink);white-space:nowrap;padding-right:16px!important}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;z-index:50;font-size:13.5px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

/* entrada */
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:15px;height:17px;flex:none}
.login{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:100dvh}
.login-side{position:relative;overflow:hidden;background:#111;color:#fff;padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-brand{position:relative;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.login-brand svg{width:20px;height:23px}
.login-mark{position:absolute;right:-120px;top:50%;width:min(540px,66vh);transform:translateY(-50%);color:rgba(255,255,255,.14);pointer-events:none}
.login-mark,.login-brand svg{transition:color .25s}
.login-side.bad .login-mark,.login-side.bad .login-brand svg{color:#e5484d}
.login-side.ok .login-mark,.login-side.ok .login-brand svg{color:#3dd68c}
.login-facts{position:relative;max-width:42ch}
.login-facts h2{color:#fff;font-size:14px;margin-bottom:10px}
.login-facts ul{list-style:none;margin:0;padding:0;font-size:13.5px;color:rgba(255,255,255,.7)}
.login-facts li{padding:10px 0;border-top:1px solid rgba(255,255,255,.16)}
.login-facts b{display:block;color:#fff;font-weight:500}
.login-main{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px}
.login-box{width:100%;max-width:340px}
.login-box h1{font-size:22px}
.login-box .lead{margin:6px 0 24px}
.login-box .field{margin-bottom:14px}
.login-box input{border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 12px;width:100%;height:40px}
.login-box .btn{width:100%;height:40px;margin-top:6px}
.login-box .btn.quiet{margin-top:4px}
.otp-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.login-box .otp{text-align:center;font-size:20px;font-weight:600;height:52px;padding:0;font-variant-numeric:tabular-nums}
.login-note{margin:28px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (max-width:820px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login-side{padding:18px 20px}
  .login-mark,.login-facts{display:none}
}

@media (max-width:1180px){
  .shell.dock-open{grid-template-columns:208px minmax(0,1fr)}
  .dock{position:fixed;top:0;right:0;bottom:0;width:min(372px,100%);z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
}
@media (max-width:900px){
  .cols,.ev-grid,.form-grid,.rules{grid-template-columns:1fr}
  .form-grid>.stack:last-child{position:static}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .ev{grid-template-columns:88px 1fr auto}
  .ev .ev-bar{display:none}
  .telao{grid-template-columns:1fr;gap:24px;padding:56px 20px 32px}
}
@media (max-width:720px){
  .shell,.shell.dock-open{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:15;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .rail .brand,.rail-foot{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const PTS={resposta:5,checkin:50,bonus:20,falta:-20};
const KEY='pontua-mvp-v1';
const CFG0=()=>({pts:{resposta:5,checkin:50,bonus:20,falta:-20},prazo:24,
  niv:[{n:'Conselho',min:150,ben:'Convite para o jantar anual da comunidade'},{n:'Titular',min:80,ben:'Recebe os convites um dia antes'},{n:'Associado',min:0,ben:''}],
  extras:[{nome:'Palestrou em um evento',pts:100},{nome:'Indicou um novo membro',pts:30},{nome:'Levou um convidado',pts:15}],
  temporada:'semestre',ci:{antes:60,depois:120},qrRot:true,lembrete:{ativo:true,horas:24},pos:true,custo:0.35,
  msg:{pos:'Obrigado por participar do {evento}, {nome}. Você ganhou {pontos_evento} pontos neste evento e está em {posicao}º lugar na temporada.',
    falta:'{nome}, você confirmou presença no {evento} e não compareceu. Foram descontados {pontos_falta} pontos.',
convite:'Olá, {nome}! Você está convidado para o {evento}.\n\nData: {data} às {hora}\nLocal: {local}\n\n{descricao}\n\nVocê vai? Responder vale {pontos_resposta} pontos e o check-in no dia vale {pontos_checkin}.',
    cobranca:'{nome}, ainda não recebemos sua resposta para o {evento}, em {data} às {hora}. Você vai? Responder vale {pontos_resposta} pontos.',
    lembrete:'Lembrete: o {evento} é em {data} às {hora}, {local}.'}});
const WHATS='5511900000000';
const RESP={'Vou':'confirmado','Não vou':'recusado','Talvez':'talvez'};
const ST={pendente:['Sem resposta','b-wait'],confirmado:['Vai','b-ok'],espera:['Lista de espera','b-fila'],recusado:['Não vai','b-bad'],talvez:['Talvez','b-maybe']};
const SEG=[['confirmado','var(--ok)','Vão'],['espera','var(--fila)','Lista de espera'],['talvez','var(--maybe)','Talvez'],['recusado','var(--bad)','Não vão'],['pendente','var(--line2)','Sem resposta']];
const NIV=[[150,'Conselho','n3'],[80,'Titular','n2'],[0,'Associado','n1']];
const DIA=86400000;

let S=null;
const VIEW0=()=>({tab:'painel',eventId:null,novo:false,chatMember:null,drawer:null,addMember:false,buscaMembro:'',dock:false,telao:null,filtro:'todos',rkTag:'Todos',editMember:false,editEvent:false,addUser:false,rkPer:'temp',importRes:null});
let view=VIEW0();
let draft=null;
let viewKey='',dockWas=false;

/* utilidades */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim().replace(/\s+/g,' ');
const fmtData=d=>{if(!d)return'';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fmtCurta=d=>{const p=d.split('-');return p[2]+'/'+p[1]};
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const primeiro=n=>n.split(' ')[0];
const iniciais=n=>{const p=String(n).trim().split(/\s+/);return((p[0][0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
const member=id=>S.members.find(m=>m.id===id);
const evento=id=>S.events.find(e=>e.id===id);
const nivel=p=>NIV.find(n=>p>=n[0])||NIV[2];
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const diasAte=d=>Math.round((Date.parse(d+'T00:00:00')-Date.parse(iso(Date.now())+'T00:00:00'))/DIA);
const fmtRel=ts=>{const d=Math.round((Date.parse(iso(Date.now())+'T00:00:00')-Date.parse(iso(ts)+'T00:00:00'))/DIA);return d<=0?'hoje':d===1?'ontem':d<30?'há '+d+' dias':fmtCurta(iso(ts))};
const pl=(n,s,p)=>n+' '+(n===1?s:p);
const ic=d=>'<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const I={painel:ic('<path d="M3 3h6v8H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 13h6v4H3z"/>'),eventos:ic('<path d="M4 5h12v12H4zM4 9h12M7 3v4M13 3v4"/>'),ranking:ic('<path d="M4 17V9M10 17V3M16 17v-6"/>'),membros:ic('<circle cx="10" cy="7" r="3"/><path d="M4 17c0-3 2.7-5 6-5s6 2 6 5"/>'),regras:ic('<path d="M5 3h10v14H5zM8 7h4M8 10h4M8 13h2"/>'),auditoria:ic('<circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/>'),fone:ic('<rect x="6" y="2" width="8" height="16" rx="2"/><path d="M9 15h2"/>'),usuarios:ic('<circle cx="7.5" cy="7" r="2.5"/><path d="M2.5 16c0-2.5 2.2-4 5-4s5 1.5 5 4"/><circle cx="14" cy="6.5" r="2"/><path d="M14.5 11.5c2 .3 3.5 1.6 3.5 3.5"/>')};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.members&&p.events)return p}}catch(e){}return null}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* regras de pontos */
function lanc(mid,eid,tipo,pontos,desc,ts){S.ledger.push({id:uid(),memberId:mid,eventId:eid,tipo,pontos,desc,ts:ts||Date.now()})}
function pontos(mid,semEv,desde){return S.ledger.reduce((a,l)=>l.memberId===mid&&l.eventId!==semEv&&(!desde||l.ts>=desde)?a+l.pontos:a,0)}
function stats(mid,semEv,desde){let pres=0,faltas=0,conf=0;S.events.forEach(e=>{if(e.id===semEv)return;if(desde&&Date.parse(e.data+'T23:59:59')<desde)return;const i=e.convidados[mid];if(!i)return;if(i.checkin)pres++;if(e.status==='encerrado'&&(i.status==='confirmado'||i.tarde)){conf++;if(!i.checkin)faltas++}});return{pres,faltas,conf}}
function ranking(tag,semEv,desde){return S.members.filter(m=>!tag||tag==='Todos'||m.tags.includes(tag)).map(m=>Object.assign({m,p:pontos(m.id,semEv,desde)},stats(m.id,semEv,desde))).sort((a,b)=>b.p-a.p||b.pres-a.pres||a.m.nome.localeCompare(b.m.nome)).map((r,i)=>Object.assign(r,{pos:i+1}))}
function ultimoFechado(){return S.events.filter(e=>e.status==='encerrado').sort((a,b)=>b.data.localeCompare(a.data))[0]}
function rankingMov(tag,desde){const r=ranking(tag,undefined,desde);const u=ultimoFechado();if(!u)return r;const ant={};ranking(tag,u.id,desde).forEach(x=>ant[x.m.id]=x.pos);r.forEach(x=>x.mv=(ant[x.m.id]||x.pos)-x.pos);return r}
/* temporada: o ranking da temporada zera, o saldo total e o nível não */
function inicioTemporada(){const d=new Date();return new Date(d.getFullYear(),S.cfg.temporada==='ano'?0:(d.getMonth()<6?0:6),1).getTime()}
function nomeTemporada(){const d=new Date();return S.cfg.temporada==='ano'?'temporada '+d.getFullYear():(d.getMonth()<6?'1º':'2º')+' semestre de '+d.getFullYear()}
/* vagas e lista de espera */
function vagasLivres(ev){return ev.vagas?ev.vagas-Object.values(ev.convidados).filter(i=>i.status==='confirmado').length:Infinity}
function filaDe(ev){return Object.keys(ev.convidados).filter(k=>ev.convidados[k].status==='espera').sort((a,b)=>ev.convidados[a].filaTs-ev.convidados[b].filaTs)}
function promover(ev){if(ev.status!=='aberto')return 0;const fila=filaDe(ev);let n=0;
  while(fila.length&&vagasLivres(ev)>0){const mid=fila.shift();ev.convidados[mid].status='confirmado';n++;pushChat(mid,{from:'bot',text:'Abriu uma vaga no '+ev.nome+'. Sua presença está confirmada para '+fmtData(ev.data)+' às '+ev.hora+', '+ev.local+'.'})}
  return n}
/* código de check-in que muda a cada minuto */
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%100000;return h};
const minuto=()=>Math.floor(Date.now()/60000);
const tokenDe=(ev,k)=>String((hash(ev.id)+k*7919)%900+100);
const codigoAtual=ev=>ev.codigo+(S.cfg.qrRot?'-'+tokenDe(ev,minuto()):'');
/* auditoria, planilhas e arquivos */
function reg(acao){(S.audit||(S.audit=[])).unshift({ts:Date.now(),quem:me().nome,acao});if(S.audit.length>300)S.audit.length=300}
const soDig=s=>String(s).replace(/\D/g,'');
const brl=v=>'R$ '+v.toFixed(2).replace('.',',');
const csv=linhas=>linhas.map(l=>l.map(c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
function baixar(nome,texto,tipo){const b=new Blob(['﻿'+texto],{type:(tipo||'text/csv')+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function parseCsv(t){t=String(t).replace(/^﻿/,'');const l1=t.split('\n')[0];const sep=(l1.match(/;/g)||[]).length>=(l1.match(/,/g)||[]).length?';':',';
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push('');else if(ch==='\n'){rows.push(cur);cur=['']}else if(ch!=='\r')cur[cur.length-1]+=ch}
  rows.push(cur);return rows.filter(r=>r.some(c=>c.trim()))}
function importarCsv(texto){const rows=parseCsv(texto);if(rows.length<2)return{erro:'A planilha está vazia ou só tem o cabeçalho.'};
  const cab=rows[0].map(c=>norm(c));const col=n=>cab.indexOf(n);if(col('NOME')<0||col('TELEFONE')<0)return{erro:'O cabeçalho precisa ter pelo menos as colunas nome e telefone.'};
  const g=(r,n)=>{const i=col(n);return i<0?'':String(r[i]||'').trim()};
  const exist=new Set(S.members.map(m=>soDig(m.telefone).slice(-11)));let novos=0,dup=0,inv=0,semAut=0;
  rows.slice(1).forEach(r=>{const nome=g(r,'NOME');const d=soDig(g(r,'TELEFONE'));if(!nome||d.length<10||d.length>13){inv++;return}const k=d.slice(-11);if(exist.has(k)){dup++;return}exist.add(k);
    const aut=/^(S|SIM|X|1)$/.test(norm(g(r,'AUTORIZOU')));if(!aut)semAut++;const tags=[g(r,'TURMA'),g(r,'CIDADE')].filter(Boolean);
    S.members.push({id:'m'+uid(),nome,telefone:'+'+(d.length<=11?'55':'')+d,empresa:g(r,'EMPRESA')||'Sem empresa',cargo:g(r,'CARGO')||'Membro',tags:tags.length?tags:['Sem turma'],optin:aut,optinEm:aut?Date.now():null,optinOrigem:aut?'Planilha importada':null,optoutEm:null,oculto:false});novos++});
  return{novos,dup,inv,semAut}}
function proximo(){return S.events.filter(e=>e.status==='aberto').sort((a,b)=>a.data.localeCompare(b.data))[0]}
function pushChat(mid,msg){(S.chats[mid]||(S.chats[mid]=[])).push(Object.assign({ts:Date.now()},msg))}

/* regras editáveis: PTS e NIV são espelhos de S.cfg, que é o que o administrador altera */
function applyCfg(){Object.assign(PTS,S.cfg.pts);NIV.length=0;S.cfg.niv.forEach((n,i)=>NIV.push([n.min,n.n,'n'+(3-i),n.ben||'']))}
function tpl(t,ev,nome,extra){
  const v=Object.assign({nome:primeiro(nome),evento:ev.nome,data:fmtData(ev.data),hora:ev.hora,local:ev.local,descricao:ev.descricao||'',pontos_resposta:PTS.resposta,pontos_checkin:PTS.checkin,pontos_falta:Math.abs(PTS.falta)},extra||{});
  return t.replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/\n{3,}/g,'\n\n').trim();
}
function conviteTexto(ev,nome){return tpl(S.cfg.msg.convite,ev,nome)}
function gerarCodigo(local,data){
  const ini=local.split(/\s+/).filter(w=>w.length>2||/^[A-Z]/.test(w)).map(w=>norm(w)[0]).join('').slice(0,2)||'EV';
  const p=data.split('-');let c=ini+p[2]+p[1];let k=0;
  while(S.events.some(e=>e.codigo===c)){k++;c=ini+p[2]+p[1]+String.fromCharCode(64+k)}
  return c;
}
function enviarConvite(ev,ids){
  let n=0;
  ids.forEach(id=>{const m=member(id);if(!m||!m.optin||ev.convidados[id])return;
    ev.convidados[id]={status:'pendente',checkin:false,respondeu:false};
    pushChat(id,{from:'bot',text:conviteTexto(ev,m.nome),buttons:['Vou','Não vou','Talvez'],eventId:ev.id,arte:'convite'});n++});
  return n;
}
function responder(eid,mid,label,opts){
  opts=opts||{};const ev=evento(eid);const inv=ev&&ev.convidados[mid];if(!inv)return;
  if(!opts.semBolha)pushChat(mid,{from:'user',text:label});
  if(ev.status!=='aberto'){pushChat(mid,{from:'bot',text:'O '+ev.nome+' já foi encerrado.'});return}
  let novo=RESP[label];const first=!inv.respondeu;const antes=inv.status;
  if(novo==='confirmado'&&antes==='espera'){pushChat(mid,{from:'bot',text:'Você já está na lista de espera. Avisamos por aqui se abrir vaga.'});return}
  if(!first&&antes===novo){pushChat(mid,{from:'bot',text:'Sua resposta já estava registrada.'});return}
  const agora=opts.ts||Date.now();const inicio=Date.parse(ev.data+'T'+ev.hora+':00');
  const foraPrazo=antes==='confirmado'&&novo!=='confirmado'&&agora>inicio-S.cfg.prazo*3600000;
  if(novo==='confirmado'&&vagasLivres(ev)<=0){novo='espera';inv.filaTs=agora}
  inv.status=novo;inv.respondeu=true;inv.tarde=foraPrazo?true:(novo==='confirmado'?false:!!inv.tarde);
  if(first)lanc(mid,eid,'resposta',PTS.resposta,'Respondeu o convite do '+ev.nome,opts.ts);
  const aviso=' Como faltam menos de '+S.cfg.prazo+' horas para o evento, a desistência conta como falta: você perde '+Math.abs(PTS.falta)+' pontos se não comparecer.';
  let t;
  if(novo==='confirmado')t='Presença confirmada. Te esperamos em '+fmtData(ev.data)+' às '+ev.hora+', '+ev.local+'. Na entrada, escaneie o QR code para fazer o check-in e ganhar '+PTS.checkin+' pontos.';
  else if(novo==='espera')t='As vagas do '+ev.nome+' acabaram. Você está na lista de espera, na posição '+(filaDe(ev).indexOf(mid)+1)+'. Avisamos por aqui se abrir vaga.';
  else if(novo==='recusado')t=foraPrazo?'Anotado.'+aviso:'Tudo bem, obrigado por avisar.';
  else t='Anotado. Quando decidir, é só tocar em Vou ou Não vou na mensagem do convite.'+(foraPrazo?aviso:'');
  if(first)t+=' Você ganhou '+PTS.resposta+' pontos por responder.';
  pushChat(mid,{from:'bot',text:t});
  if(antes==='confirmado'&&novo!=='confirmado')promover(ev);
}
function doCheckin(ev,mid,ts){
  const inv=ev.convidados[mid];inv.checkin=true;
  lanc(mid,ev.id,'checkin',PTS.checkin,'Check-in no '+ev.nome,ts);
  if(inv.status==='confirmado'){lanc(mid,ev.id,'bonus',PTS.bonus,'Bônus: confirmou e compareceu ao '+ev.nome,ts);return PTS.checkin+PTS.bonus}
  return PTS.checkin;
}
function encerrar(ev,ts){
  ev.status='encerrado';ev.checkinAberto=false;let n=0;const faltou=i=>(i.status==='confirmado'||i.tarde)&&!i.checkin;
  Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];if(faltou(i)){lanc(mid,ev.id,'falta',PTS.falta,(i.tarde?'Desistiu fora do prazo e não compareceu ao ':'Confirmou e não compareceu ao ')+ev.nome,ts);n++}});
  if(S.cfg.pos){const rk={};ranking(undefined,undefined,inicioTemporada()).forEach(x=>rk[x.m.id]=x.pos);
    Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];const m=member(mid);if(!m||!m.optin)return;
      if(i.checkin)pushChat(mid,{from:'bot',text:tpl(S.cfg.msg.pos,ev,m.nome,{pontos_evento:S.ledger.reduce((a,l)=>l.memberId===mid&&l.eventId===ev.id?a+l.pontos:a,0),posicao:rk[mid]}),eventId:ev.id,arte:'pontos'});
      else if(faltou(i))pushChat(mid,{from:'bot',text:tpl(S.cfg.msg.falta,ev,m.nome)})})}
  return n;
}
function eventoAbertoDoMembro(mid){
  return S.events.filter(e=>e.status==='aberto'&&e.convidados[mid]).sort((a,b)=>b.data.localeCompare(a.data))[0];
}
function processar(mid,texto){
  const m=member(mid);const t=norm(texto);
  pushChat(mid,{from:'user',text:texto});
  const bot=s=>pushChat(mid,{from:'bot',text:s});
  if(t==='SAIR'){m.optin=false;m.optoutEm=Date.now();bot('Pronto, você não vai mais receber convites do Pontua. Para voltar, envie VOLTAR.');return}
  if(t==='VOLTAR'){m.optin=true;m.optinEm=Date.now();m.optinOrigem='WhatsApp, comando VOLTAR';m.optoutEm=null;bot('Você voltou a receber os convites do Pontua.');return}
  if(t==='OCULTAR'){m.oculto=true;bot('Pronto. Seu nome não aparece mais no ranking que os outros membros veem. Para voltar, envie MOSTRAR.');return}
  if(t==='MOSTRAR'){m.oculto=false;bot('Seu nome voltou a aparecer no ranking.');return}
  const desde=inicioTemporada();
  if(t==='PONTOS'){
    const total=pontos(mid);const r=ranking(undefined,undefined,desde);const eu=r.find(x=>x.m.id===mid);
    const ult=S.ledger.filter(l=>l.memberId===mid).sort((a,b)=>b.ts-a.ts).slice(0,3);
    if(!ult.length){bot('Você ainda não tem pontos. Responda um convite ou faça check-in em um evento para começar.');return}
    const nv=nivel(total);const prox=NIV.filter(n=>n[0]>total).pop();
    bot('Você tem '+total+' pontos no total. No '+nomeTemporada()+' são '+eu.p+' pontos e o '+eu.pos+'º lugar entre '+r.length+' membros.\n\nNível: '+nv[1]+(nv[3]?' ('+nv[3]+')':'')+(prox?'. Faltam '+(prox[0]-total)+' pontos para '+prox[1]+'.':'.')+'\n\nÚltimos lançamentos:\n'+ult.map(l=>(l.pontos>0?'+':'')+l.pontos+' '+l.desc).join('\n'));return}
  if(t==='RANKING'){
    const r=ranking(undefined,undefined,desde);const eu=r.find(x=>x.m.id===mid);
    const nm=x=>x.m.id===mid?x.m.nome+' (você)':x.m.oculto?'Membro oculto':x.m.nome;
    let s='Ranking do Pontua, '+nomeTemporada()+'\n\n'+r.slice(0,5).map(x=>x.pos+'º '+nm(x)+', '+x.p+' pts').join('\n');
    if(eu.pos>5)s+='\n\n'+eu.pos+'º Você, '+eu.p+' pts';
    bot(s);return}
  if(t.startsWith('CHECKIN')){
    const cod=t.replace('CHECKIN','').trim().replace(/\s/g,'');
    if(!cod){bot('Envie CHECKIN seguido do código do evento. O mais fácil é escanear o QR code da entrada.');return}
    const partes=cod.split('-');const ev=S.events.find(e=>e.codigo===partes[0]);
    if(!ev){bot('Código não encontrado. Confira o código no QR code da entrada.');return}
    if(ev.status!=='aberto'||!ev.checkinAberto){bot('O check-in do '+ev.nome+' não está aberto agora.');return}
    if(S.cfg.qrRot&&partes[1]!==tokenDe(ev,minuto())&&partes[1]!==tokenDe(ev,minuto()-1)){bot('Esse código expirou. Escaneie de novo o QR code que está na entrada.');return}
    const inv=ev.convidados[mid];
    if(!inv){bot('Você não está na lista de convidados do '+ev.nome+'. Fale com a organização na entrada.');return}
    if(inv.checkin){bot('Você já fez check-in no '+ev.nome+'.');return}
    const g=doCheckin(ev,mid);
    pushChat(mid,{from:'bot',text:'Check-in feito no '+ev.nome+'. Você ganhou '+g+' pontos'+(g>PTS.checkin?' (inclui o bônus por ter confirmado)':'')+'. Seu total agora é '+pontos(mid)+'.',eventId:ev.id,arte:'pontos'});return}
  const map={'VOU':'Vou','SIM':'Vou','NAO':'Não vou','NAO VOU':'Não vou','TALVEZ':'Talvez'};
  if(map[t]){const ev=eventoAbertoDoMembro(mid);if(ev){responder(ev.id,mid,map[t],{semBolha:true});return}bot('Você não tem nenhum convite aberto agora.');return}
  if(t==='AJUDA'){bot('Comandos disponíveis:\n\nPONTOS para ver seu saldo e seu nível\nRANKING para ver os primeiros colocados\nOCULTAR para não aparecer com nome no ranking\nSAIR para não receber mais convites\n\nNo dia do evento, escaneie o QR code da entrada para fazer o check-in.');return}
  bot('Não entendi. Envie AJUDA para ver o que posso fazer.');
}

/* reduz a imagem antes de guardar, para caber no armazenamento do navegador */
function lerArte(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>cb(null);im.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}

function vDock(entrou){

/* eventos de interface */
document.addEventListener('click',e=>{
  const sel=e.target.closest('[data-sel]');
  if(sel){const id=sel.getAttribute('data-sel');if(sel.checked)draft.sel.add(id);else draft.sel.delete(id);updDraft();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='login-voltar'){loginSt.passo=1;loginSt.erro='';loginSt.marca='';render();return}
  if(a==='sair'){sair();return}
  const papel=me().papel;
  if(papel!=='admin'&&(SO_ADMIN.has(a)||(a==='tab'&&v==='usuarios'))){toast('Só administradores podem fazer isso');return}
  if(papel==='leitura'&&ESCRITA.has(a)){toast('Seu perfil é só de leitura');return}
  if(a==='user-new'){view.addUser=!view.addUser;render();return}
  if(a==='user-toggle'||a==='user-del'){const u=S.users.find(x=>x.id===v);if(!u||u.id===me().id)return;
    if(u.papel==='admin'&&u.ativo&&adminsAtivos()===1){toast('Precisa existir pelo menos um administrador ativo');return}
    if(a==='user-toggle'){u.ativo=!u.ativo;render();toast(u.nome+(u.ativo?' reativado':' desativado'));return}
    if(!confirm('Remover '+u.nome+'? A pessoa perde o acesso ao painel.'))return;
    S.users=S.users.filter(x=>x.id!==v);render();toast(u.nome+' removido');return}
  if(a==='tab'){view.tab=v;view.novo=false;view.eventId=null;view.drawer=null;render();window.scrollTo(0,0);return}
  if(a==='reset'){if(confirm('Restaurar os dados de exemplo? As mudanças feitas na demonstração serão perdidas.')){seed();draft=null;const d=view.dock;view=VIEW0();view.dock=d;render();toast('Dados de exemplo restaurados')}return}
  if(a==='dock'){view.dock=!view.dock;render();return}
  if(a==='open-ev'){view.tab='eventos';view.eventId=v;view.novo=false;view.filtro='todos';view.editEvent=false;render();window.scrollTo(0,0);return}
  if(a==='back'){view.eventId=null;view.novo=false;view.editEvent=false;render();return}
  if(a==='novo'){view.tab='eventos';view.novo=true;view.eventId=null;draft=null;render();window.scrollTo(0,0);return}
  if(a==='arte-del'){const al=arteAlvo();if(al&&al.artes){delete al.artes[v];render()}return}
  if(a==='rk-tag'){view.rkTag=v;render();return}
  if(a==='filtro'){view.filtro=v;render();return}
  if(a==='tag'){draft.tag=v;document.querySelectorAll('.chip[data-act="tag"]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v));updDraft();return}
  if(a==='sel-all'){visiveis().filter(m=>m.optin).forEach(m=>draft.sel.add(m.id));updDraft();return}
  if(a==='sel-none'){visiveis().forEach(m=>draft.sel.delete(m.id));updDraft();return}
  if(a==='enviar'){
    const err=document.getElementById('ferr');const ids=Array.from(draft.sel).filter(id=>member(id)&&member(id).optin);
    const falta=[];if(!draft.nome.trim())falta.push('nome');if(!draft.data)falta.push('data');if(!draft.hora)falta.push('horário');if(!draft.local.trim())falta.push('local');
    if(falta.length){err.textContent='Preencha '+falta.join(', ')+' para enviar.';return}
    if(!ids.length){err.textContent='Selecione pelo menos um convidado.';return}
    const ev={id:'e'+uid(),nome:draft.nome.trim(),data:draft.data,hora:draft.hora,local:draft.local.trim(),descricao:draft.descricao.trim(),codigo:gerarCodigo(draft.local.trim(),draft.data),status:'aberto',checkinAberto:false,convidados:{},lembrete:null,cobranca:null,artes:draft.artes||{}};
    S.events.push(ev);const n=enviarConvite(ev,ids);draft=null;view.novo=false;view.eventId=ev.id;view.filtro='todos';render();window.scrollTo(0,0);toast('Convite enviado para '+pl(n,'membro','membros'));return}
  const ev=evento(t.dataset.ev||view.eventId);
  if(a==='lembrete'&&ev){let n=0;Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];if(i.status==='confirmado'||i.status==='talvez'){pushChat(mid,{from:'bot',text:tpl(S.cfg.msg.lembrete,ev,member(mid).nome)+' '+(i.status==='talvez'?'Ainda dá tempo de confirmar no convite acima.':'Não esqueça do check-in na entrada para ganhar seus pontos.'),eventId:ev.id,arte:'lembrete'});n++}});ev.lembrete=Date.now();render();toast('Lembrete enviado para '+pl(n,'membro','membros'));return}
  if(a==='cobrar'&&ev){let n=0;Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];const m=member(mid);if(i.status==='pendente'&&m&&m.optin){pushChat(mid,{from:'bot',text:tpl(S.cfg.msg.cobranca,ev,m.nome),buttons:['Vou','Não vou','Talvez'],eventId:ev.id,arte:'cobranca'});n++}});ev.cobranca=Date.now();render();toast('Cobrança enviada para '+pl(n,'membro','membros'));return}
  if(a==='toggle-ci'&&ev){ev.checkinAberto=!ev.checkinAberto;if(!ev.checkinAberto)view.telao=null;render();toast(ev.checkinAberto?'Check-in aberto':'Check-in fechado');return}
  if(a==='telao'&&ev){view.telao=ev.id;render();return}
  if(a==='close-telao'){view.telao=null;render();return}
  if(a==='manual'&&ev){const m=member(v);if(!m||ev.convidados[v].checkin)return;const g=doCheckin(ev,v);pushChat(v,{from:'bot',text:'Sua presença no '+ev.nome+' foi registrada pela organização. Você ganhou '+g+' pontos. Seu total agora é '+pontos(v)+'.',eventId:ev.id,arte:'pontos'});render();toast('Presença de '+primeiro(m.nome)+' registrada, +'+g+' pontos');return}
  if(a==='sim-resp'&&ev){let n=0;Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];if(i.respondeu)return;const x=Math.random();if(x<.85){responder(ev.id,mid,x<.55?'Vou':x<.75?'Não vou':'Talvez');n++}});render();toast(pl(n,'resposta recebida','respostas recebidas'));return}
  const chegar=mid=>{pushChat(mid,{from:'user',text:'CHECKIN '+ev.codigo});const g=doCheckin(ev,mid);pushChat(mid,{from:'bot',text:'Check-in feito no '+ev.nome+'. Você ganhou '+g+' pontos. Seu total agora é '+pontos(mid)+'.',eventId:ev.id,arte:'pontos'})};
  if(a==='sim-ci'&&ev){let n=0;Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];if(i.checkin)return;const pr=i.status==='confirmado'?.8:i.status==='talvez'?.35:0;if(Math.random()<pr){chegar(mid);n++}});render();toast(pl(n,'check-in registrado','check-ins registrados'));return}
  if(a==='sim-um'&&ev){const c=Object.keys(ev.convidados).filter(mid=>!ev.convidados[mid].checkin&&ev.convidados[mid].status!=='recusado');const f=c.filter(mid=>ev.convidados[mid].status==='confirmado');const pool=f.length?f:c;if(!pool.length){toast('Todos já chegaram');return}const mid=pool[Math.floor(Math.random()*pool.length)];chegar(mid);render();toast(member(mid).nome+' chegou');return}
  if(a==='encerrar'&&ev){if(!confirm('Encerrar o evento? O check-in fecha e quem confirmou e faltou perde '+Math.abs(PTS.falta)+' pontos.'))return;const n=encerrar(ev);view.telao=null;render();toast('Evento encerrado. '+pl(n,'falta registrada','faltas registradas'));return}
  if(a==='member'){view.drawer=v;view.editMember=false;render();return}
  if(a==='close-drawer'){view.drawer=null;view.editMember=false;render();return}
  if(a==='edit-member'){view.editMember=!view.editMember;render();return}
  if(a==='edit-event'){view.editEvent=!view.editEvent;render();return}
  if(a==='cfg-reset'){if(!confirm('Voltar todas as regras e mensagens para o padrão?'))return;S.cfg=CFG0();applyCfg();render();toast('Regras restauradas para o padrão');return}
  if(a==='chat-with'){view.chatMember=v;view.drawer=null;view.dock=true;render();return}
  if(a==='chat-btn'){responder(t.dataset.ev,view.chatMember,v);render();return}
  if(a==='cmd'){processar(view.chatMember,v);render();return}
  if(a==='add-toggle'){view.addMember=!view.addMember;render();return}
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.arte){const k=e.target.dataset.arte;const file=e.target.files&&e.target.files[0];const al=arteAlvo();if(!file||!al)return;
    if(me().papel==='leitura'){toast('Seu perfil é só de leitura');return}
    if(!/^image\//.test(file.type)){toast('Escolha um arquivo de imagem');return}
    lerArte(file,src=>{if(!src){toast('Não foi possível ler a imagem');return}(al.artes||(al.artes={}))[k]=src;render();toast('Arte de '+ARTES.find(a=>a[0]===k)[1].toLowerCase()+' anexada')});return}
  if(e.target.id==='docksel'){view.chatMember=e.target.value;render();return}
  if(e.target.id==='mesel'){S.me=e.target.value;const u=me();u.ultimo=Date.now();if(u.papel!=='admin'&&view.tab==='usuarios')view.tab='painel';render();toast('Vendo como '+u.nome+', '+PAPEL[u.papel]);return}
  const uid2=e.target.dataset&&e.target.dataset.papel;
  if(uid2){const u=S.users.find(x=>x.id===uid2);if(!u)return;
    if(me().papel!=='admin'){render();toast('Só administradores podem fazer isso');return}
    if(u.papel==='admin'&&u.ativo&&adminsAtivos()===1&&e.target.value!=='admin'){render();toast('Precisa existir pelo menos um administrador ativo');return}
    u.papel=e.target.value;render();toast(u.nome+' agora é '+PAPEL[u.papel])}
});
document.addEventListener('input',e=>{
  if(loginSt.marca==='bad'&&!travaSeg()&&e.target.closest('.login-box'))marcaLogin('');
  if(e.target.classList.contains('otp')){const cx=Array.from(document.querySelectorAll('.otp'));const i=cx.indexOf(e.target);
    const d=soDig(e.target.value);e.target.value=d.slice(0,1);
    if(d&&cx[i+1])cx[i+1].focus();
    if(cx.every(c=>c.value))document.getElementById('codeform').requestSubmit();return}
  const b=e.target.dataset&&e.target.dataset.bind;
  if(b&&draft){draft[b]=e.target.value;const err=document.getElementById('ferr');if(err)err.textContent='';updDraft();return}
  if(e.target.id==='buscaMembro'){view.buscaMembro=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('buscaMembro');i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginform'){if(travaSeg()>0)return;const L=loginSt;L.aviso='';
    L.email=document.getElementById('lemail').value.trim();const senha=document.getElementById('lsenha').value;
    const u=S.users.find(x=>x.ativo&&x.email.toLowerCase()===L.email.toLowerCase());
    /* a mensagem é a mesma para e-mail e para senha errados, de propósito */
    if(!u||senha!==DEMO_SENHA){L.falhas++;L.erro='E-mail ou senha incorretos.';L.marca='bad';if(L.falhas>=5){L.falhas=0;L.trava=Date.now()+30000}render();return}
    L.uid=u.id;L.passo=2;L.erro='';L.marca='';render();return}
  if(e.target.id==='codeform'){if(loginSt.entrando)return;const cod=Array.from(document.querySelectorAll('.otp')).map(c=>c.value).join('');
    if(!/^\d{6}$/.test(cod)){document.getElementById('lerr').textContent='Digite os 6 dígitos do código.';marcaLogin('bad');return}
    if(cod!==DEMO_COD){const L=loginSt;L.falhas++;
      if(L.falhas>=5){L.falhas=0;L.trava=Date.now()+30000;L.passo=1;L.erro='';L.marca='bad';render();return}
      document.getElementById('lerr').textContent='Código incorreto.';marcaLogin('bad');
      const cx=document.querySelectorAll('.otp');cx.forEach(c=>c.value='');cx[0].focus();return}
    /* ingresso fica verde, o traço se refaz e só então o painel abre */
    loginSt.entrando=true;document.getElementById('lerr').textContent='';marcaLogin('ok');
    e.target.querySelectorAll('input,button').forEach(el=>el.disabled=true);e.target.querySelector('[type=submit]').textContent='Entrando';
    setTimeout(()=>{sessao=loginSt.uid;S.me=sessao;sessGravar(sessao);me().ultimo=Date.now();ultAtiv=Date.now();reg('Entrou no painel');loginSt=LOGIN0();view=VIEW0();render()},1150);return}
  if(e.target.id==='chatform'){const i=document.getElementById('chatin');const v=i.value.trim();if(!v)return;processar(view.chatMember,v);render();const n=document.getElementById('chatin');if(n)n.focus();return}
  const papel=me().papel;
  if(papel!=='admin'&&FORM_SO_ADMIN.has(e.target.id)){toast('Só administradores podem fazer isso');return}
  if(papel==='leitura'){toast('Seu perfil é só de leitura');return}
  if(e.target.id==='userform'){const f=new FormData(e.target);const nome=String(f.get('nome')||'').trim();const email=String(f.get('email')||'').trim().toLowerCase();const err=document.getElementById('uerr');
    if(!nome){err.textContent='Informe o nome.';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Informe um e-mail válido.';return}
    if(S.users.some(u=>u.email.toLowerCase()===email)){err.textContent='Já existe um usuário com esse e-mail.';return}
    S.users.push({id:'u'+uid(),nome,email,papel:PAPEL[f.get('papel')]?f.get('papel'):'leitura',ativo:true,ultimo:null});
    view.addUser=false;render();toast('Convite enviado para '+email);return}
  if(e.target.id==='cfgform'){
    const f=new FormData(e.target);const num=k=>Number(f.get(k));const txt=k=>String(f.get(k)||'').trim();
    const falha=m=>{document.getElementById('cerr').textContent=m;window.scrollTo(0,0)};
    const nums=['resposta','checkin','bonus','falta','prazo','nm0','nm1','antes','depois','horas'];
    if(nums.some(k=>f.get(k)===''||!Number.isInteger(num(k))||num(k)<0)){falha('Preencha todos os números com valores inteiros, sem sinal.');return}
    if(!(num('nm0')>num('nm1')&&num('nm1')>0)){falha('O nível 3 precisa de mais pontos que o nível 2, e o nível 2 precisa ser maior que zero.');return}
    if(['nn0','nn1','nn2','convite','cobranca','lembrete'].some(k=>!txt(k))){falha('Os nomes dos níveis e os textos das mensagens não podem ficar vazios.');return}
    S.cfg=Object.assign({},S.cfg,{pts:{resposta:num('resposta'),checkin:num('checkin'),bonus:num('bonus'),falta:-num('falta')},prazo:num('prazo'),
      niv:[{n:txt('nn0'),min:num('nm0'),ben:txt('nb0')},{n:txt('nn1'),min:num('nm1'),ben:txt('nb1')},{n:txt('nn2'),min:0,ben:txt('nb2')}],
      extras:[0,1,2,3].map(i=>({nome:txt('xn'+i),pts:num('xp'+i)})).filter(x=>x.nome&&x.pts>0),
      temporada:txt('temporada')==='ano'?'ano':'semestre',qrRot:!!f.get('qrRot'),pos:!!f.get('pos'),custo:num('custo')>=0?num('custo'):S.cfg.custo,
      ci:{antes:num('antes'),depois:num('depois')},lembrete:{ativo:!!f.get('lembAtivo'),horas:num('horas')},
      msg:{convite:txt('convite'),cobranca:txt('cobranca'),lembrete:txt('lembrete'),pos:txt('pos')||S.cfg.msg.pos,falta:txt('mfalta')||S.cfg.msg.falta}});
    applyCfg();render();toast('Regras salvas');return}
  if(e.target.id==='memberform'){const m=member(view.drawer);if(!m)return;const f=new FormData(e.target);const nome=String(f.get('nome')||'').trim();const tel=String(f.get('tel')||'').trim();if(!nome||!tel)return;
    const tags=String(f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean);
    Object.assign(m,{nome,telefone:tel,cargo:String(f.get('cargo')||'').trim()||'Membro',empresa:String(f.get('emp')||'').trim()||'Sem empresa',tags:tags.length?tags:['Sem turma'],optin:!!f.get('optin')});
    view.editMember=false;render();toast('Dados de '+primeiro(nome)+' atualizados');return}
  if(e.target.id==='ajusteform'){const m=member(view.drawer);if(!m)return;const f=new FormData(e.target);const v=Number(f.get('v'));const motivo=String(f.get('motivo')||'').trim();
    if(!Number.isInteger(v)||v===0||!motivo){document.getElementById('aerr').textContent='Informe um número inteiro diferente de zero e o motivo.';return}
    lanc(m.id,null,'ajuste',v,'Ajuste manual: '+motivo);render();toast((v>0?'+':'')+v+' pontos para '+primeiro(m.nome));return}
  if(e.target.id==='eventform'){const ev=evento(view.eventId);if(!ev)return;const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();
    if(!g('nome')||!g('data')||!g('hora')||!g('local'))return;
    const mudou=ev.data!==g('data')||ev.hora!==g('hora')||ev.local!==g('local');
    Object.assign(ev,{nome:g('nome'),data:g('data'),hora:g('hora'),local:g('local'),descricao:g('descricao')});
    let n=0;if(mudou&&f.get('avisar')&&ev.status==='aberto')Object.keys(ev.convidados).forEach(mid=>{const i=ev.convidados[mid];const m=member(mid);if(m&&m.optin&&i.status!=='recusado'){pushChat(mid,{from:'bot',text:'Atenção: o '+ev.nome+' mudou. Agora é em '+fmtData(ev.data)+' às '+ev.hora+', '+ev.local+'.'});n++}});
    view.editEvent=false;render();toast(n?'Evento atualizado e '+pl(n,'convidado avisado','convidados avisados'):'Evento atualizado');return}
  if(e.target.id==='addform'){const f=new FormData(e.target);const nome=String(f.get('nome')||'').trim();const tel=String(f.get('tel')||'').trim();if(!nome||!tel)return;
    const tags=String(f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean);
    S.members.push({id:'m'+uid(),nome,telefone:tel,empresa:String(f.get('emp')||'').trim()||'Sem empresa',cargo:'Membro',tags:tags.length?tags:['Sem turma'],optin:!!f.get('optin')});
    view.addMember=false;render();toast(nome+' adicionado')}
});
document.addEventListener('keydown',e=>{if(e.key!=='Backspace'||!e.target.classList||!e.target.classList.contains('otp')||e.target.value)return;
  const cx=Array.from(document.querySelectorAll('.otp'));const p=cx[cx.indexOf(e.target)-1];if(p){p.value='';p.focus()}});
document.addEventListener('paste',e=>{if(!e.target.classList||!e.target.classList.contains('otp'))return;e.preventDefault();
  const d=soDig(e.clipboardData.getData('text')).slice(0,6);const cx=Array.from(document.querySelectorAll('.otp'));
  cx.forEach((c,i)=>c.value=d[i]||'');(cx[Math.min(d.length,5)]||cx[0]).focus();
  if(d.length===6)document.getElementById('codeform').requestSubmit()});
['click','keydown','input'].forEach(t=>document.addEventListener(t,()=>{ultAtiv=Date.now()},true));
setInterval(()=>{
  if(sessao&&Date.now()-ultAtiv>INATIVO){sair('Sessão encerrada por inatividade. Entre de novo para continuar.');return}
  if(!sessao&&loginSt.trava){if(travaSeg()>0){const el=document.getElementById('lerr');if(el)el.textContent='Muitas tentativas. Aguarde '+travaSeg()+' s para tentar de novo.'}else{loginSt.trava=0;loginSt.erro='';loginSt.marca='';render()}}
},1000);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(view.telao){view.telao=null;render()}else if(view.drawer){view.drawer=null;render()}});

S=load();if(!S)seed();
if(!S.cfg)S.cfg=CFG0();
if(!S.users){S.users=USERS0();S.me='u1'}
applyCfg();
{const s0=sessLer();sessao=s0&&S.users.some(u=>u.id===s0&&u.ativo)?s0:null}
render();
</script>
